name: TrainingBot Admin Stage D — integration and acceptance
on:
  push:
    branches:
      - aion-trainingbot-admin-stage-d-20261028
permissions:
  contents: read
jobs:
  stage-d:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Stage D source inventory
        run: node tools/admin/adm07-legacy-inventory.mjs --details
      - name: Build protected Admin Preview without deploying
        run: npm run build
      - name: Verify source safety
        run: |
          test ! -f .github/workflows/trainingbot-d1-encrypted-backup.yml
          test ! -f scripts/backup_d1_to_github.py
          node --check public/admin-stage-b-ui.js
          node --check public/admin-stage-c-ui.js
          node --check public/admin-image-manager-v1.js
          node --check public/admin_visitor_tracking_v177.js
      - name: Isolated backend integration (A and C)
        run: |
          node tools/admin/adm06-draft-handler-qa.mjs
          node tools/admin/adm07-real-secondary-handler-qa.mjs

      - name: Install browser test harness
        run: npm install --no-save --no-package-lock playwright
      - name: Regression Stage A — real handlers with isolated D1 and login
        run: |
          node tools/admin/adm01-state-qa.mjs
          node tools/admin/adm01-real-handler-integration.mjs
      - name: Regression Stage C — content and editor
        run: node tools/admin/adm04-06-browser-qa.mjs
      - name: Stage D — secondary panels and full 13-route browser QA
        run: node tools/admin/adm07-09-browser-qa.mjs
      - name: Upload synthetic Admin acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trainingbot-admin-stage-d-mock-screenshots
          path: admin-qa-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
