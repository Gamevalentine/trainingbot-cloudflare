name: TrainingBot Erangel D1 — final read-only verification
on:
  push:
    branches: [main]
    paths: [.github/workflows/trainingbot-erangel-d1-migrate.yml]
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify completed D1 record and original backup; no write operations
        run: |
          node --input-type=module <<'NODE'
          const oidc=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          oidc.searchParams.set("audience","trainingbot-erangel-d1-migration-v1");
          const issue=async()=>{
            const response=await fetch(oidc,{headers:{Authorization:"Bearer "+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});
            if(!response.ok)throw Error("GitHub OIDC issue failed: HTTP "+response.status);
            const token=(await response.json()).value;
            if(typeof token!=="string"||token.split(".").length!==3)throw Error("OIDC token unavailable");
            return token;
          };
          const endpoint="https://trainingbot-cloudflare.pages.dev/api/v71/admin/erangel-correction";
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          let confirmed=false;
          for(let attempt=1;attempt<=12;attempt++){
            const response=await fetch(endpoint,{method:"GET",headers:{
              Authorization:"Bearer "+await issue(),Accept:"application/json"
            },signal:AbortSignal.timeout(12000)});
            const state=await response.json().catch(()=>({}));
            const ok=response.status===200&&state.ok===true&&
              state.migration_state==="applied"&&state.backup_exists===true&&
              state.stored_correction===true&&state.public_fallback_required===false;
            console.log("ERANGEL_D1_POST_RELEASE_READ_ONLY",JSON.stringify({attempt,status:response.status,
              migration_state:state.migration_state||null,backup_exists:state.backup_exists===true,
              stored_correction:state.stored_correction===true,
              public_fallback_required:state.public_fallback_required??null,verified:ok}));
            if(ok){confirmed=true;break}
            if(response.status===200)throw Error("Unexpected D1 state after migration; no change attempted");
            if(![401,503].includes(response.status))throw Error("Unexpected status; no D1 change attempted");
            if(attempt<12)await sleep(8000);
          }
          if(!confirmed)throw Error("Cannot verify D1 after migration; no change attempted");
          const slug="battlegrounds-mo-rong-erangel-subzero-trong-pubg-mobile-bgmi-voi-ban-beta-4-7-2";
          const article=await fetch("https://trainingbot-cloudflare.pages.dev/bai-viet/"+slug,{
            method:"GET",headers:{Accept:"text/html"},signal:AbortSignal.timeout(12000)});
          const html=await article.text();
          const corrected=article.status===200&&
            html.includes("ĐÍNH CHÍNH: Erangel Subzero của PUBG Mobile Beta 4.7 khác PUBG PC Update 39.2");
          console.log("ERANGEL_PUBLIC_AFTER_RELEASE",JSON.stringify({status:article.status,corrected_heading:corrected}));
          if(!corrected)throw Error("Public article needs review; D1 was not modified");
          console.log("ERANGEL_D1_MIGRATION_FINAL_VERIFIED; backup retained, no writes");
          NODE
