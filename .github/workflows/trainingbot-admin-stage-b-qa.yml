name: TrainingBot Admin Stage B — full navigation and responsive QA
on:
  push:
    branches:
      - aion-trainingbot-admin-stage-b-20261028

permissions:
  contents: read

jobs:
  stage-b:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Build full Admin from Stage A without publishing
        run: npm run build
      - name: Verify Stage B source and protected Admin loader
        run: |
          node --check public/admin-stage-b-ui.js
          node --check tools/admin/adm02-03-ui-qa.mjs
          node --check tools/admin/adm01-state-qa.mjs
          node --check tools/admin/adm01-real-handler-integration.mjs
          grep -q "admin-stage-b-ui.js" public/admin.html
          test ! -f .github/workflows/trainingbot-d1-encrypted-backup.yml
          test ! -f scripts/backup_d1_to_github.py
      - name: Install browser test harness
        run: npm install --no-save --no-package-lock playwright
      - name: Regression Stage A — original Admin data, auth and functions
        run: |
          node tools/admin/adm01-state-qa.mjs
          node tools/admin/adm01-real-handler-integration.mjs
      - name: Acceptance Stage B — grouped menu and responsive shell
        run: node tools/admin/adm02-03-ui-qa.mjs

      - name: Upload synthetic Admin screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-stage-b-synthetic-desktop-mobile
          path: admin-qa-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
