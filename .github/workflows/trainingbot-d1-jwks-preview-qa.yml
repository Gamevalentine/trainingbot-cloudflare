name: TrainingBot D1.2 — isolate Preview JWKS egress and crypto
on:
  push:
    branches: [aion-trainingbot-d1-jwks-preview-20261030]
    paths: [functions/d1-jwks-health.js, .github/workflows/trainingbot-d1-jwks-preview-qa.yml]
permissions:
  contents: read
jobs:
  preview-jwks:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Compare Cloudflare outbound requests with local RSA public-key import
        run: |
          node --input-type=module <<'NODE'
          const base="https://aion-trainingbot-d1-jwks-pre.trainingbot-cloudflare.pages.dev/d1-jwks-health";
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let control;
          for(let i=1;i<=18;i++){
            try{
              const r=await fetch(base+"?mode=control",{method:"GET",signal:AbortSignal.timeout(25000)});
              const body=await r.json().catch(()=>({}));
              if(r.status===200&&body.diagnostic_version==="d1-20261030-control"){
                control=body;break;
              }
              console.log("Waiting for current Preview diagnostics; attempt",i,"HTTP",r.status);
            }catch(error){console.log("Preview not ready; attempt",i,error?.name||"Error")}
            if(i<18)await sleep(6000);
          }
          if(!control)throw Error("Preview control endpoint did not deploy");
          console.log("PAGES_RUNTIME_EGRESS",JSON.stringify(control.checks));
          const official=await fetch("https://token.actions.githubusercontent.com/.well-known/jwks");
          if(!official.ok)throw Error("Official JWKS not accessible from GitHub runner");
          const data=await official.json();
          console.log("OFFICIAL_GITHUB_PUBLIC_JWKS",JSON.stringify(data.keys.filter(x=>x.kty==="RSA"&&x.alg==="RS256"&&x.use==="sig"&&x.kid&&x.n&&x.e).map(x=>({kty:x.kty,alg:x.alg,use:x.use,kid:x.kid,n:x.n,e:x.e}))));
          const key=data.keys.find(x=>x.kty==="RSA"&&x.alg==="RS256"&&x.use==="sig"&&x.n&&x.e);
          if(!key)throw Error("No official RSA signing key");
          const publicKey=Buffer.from(JSON.stringify({kty:key.kty,alg:key.alg,use:key.use,kid:key.kid,n:key.n,e:key.e})).toString("base64url");
          const probe=await fetch(base+"?mode=import&jwk="+publicKey,{method:"GET",signal:AbortSignal.timeout(15000)});
          const result=await probe.json().catch(()=>({}));
          console.log("PAGES_RUNTIME_CRYPTO",JSON.stringify({
            status:probe.status,ok:result.ok===true,
            stage:result.stage||null,crypto_import_ok:result.crypto_import_ok===true,
            error_class:result.error_class||null
          }));
          if(probe.status!==200||result.crypto_import_ok!==true)
            throw Error("Preview WebCrypto cannot import GitHub public key; no D1 change");
          console.log("PREVIEW_PUBLIC_RSA_IMPORT_PASS; no credentials and no D1 access");
          NODE
