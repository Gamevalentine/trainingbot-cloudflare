<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Malaysia vô địch PlayGalaxy Cup World Final 2026</title>
<desc id="desc">Bìa esports xanh vàng với cúp vô địch, đội Malaysia, cờ Malaysia, sân khấu và Cologne.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030713"/><stop offset=".48" stop-color="#071a3a"/><stop offset="1" stop-color="#03111e"/></linearGradient>
  <radialGradient id="blue" cx="68%" cy="18%" r="62%"><stop stop-color="#197cff" stop-opacity=".82"/><stop offset="1" stop-color="#197cff" stop-opacity="0"/></radialGradient>
  <radialGradient id="goldGlow" cx="67%" cy="32%" r="30%"><stop stop-color="#ffd86a" stop-opacity=".55"/><stop offset="1" stop-color="#ffc83d" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0a6"/><stop offset=".35" stop-color="#f9c846"/><stop offset=".68" stop-color="#b96d11"/><stop offset="1" stop-color="#ffe477"/></linearGradient>
  <linearGradient id="jersey" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#151a25"/><stop offset="1" stop-color="#05070d"/></linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".55"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#blue)"/><rect width="1600" height="900" fill="url(#goldGlow)"/>
<!-- stage beams -->
<g opacity=".34" fill="#7bb7ff"><path d="M120 0h110l210 900H280z"/><path d="M470 0h80l110 900H470z"/><path d="M1280 0h95l-210 900h-150z"/></g>
<g opacity=".55" fill="#5ea4ff" filter="url(#glow)"><circle cx="200" cy="72" r="11"/><circle cx="420" cy="55" r="9"/><circle cx="690" cy="78" r="12"/><circle cx="1120" cy="60" r="10"/><circle cx="1380" cy="88" r="12"/></g>
<!-- Cologne cathedral silhouette -->
<g opacity=".38" fill="#bdd8ff" transform="translate(1230 125)"><path d="M72 430h190v170H72z"/><path d="M98 430V170l25-116 25 116v260zM188 430V135l25-120 25 120v295z"/><path d="M118 230h18v200h-18zm90-35h18v235h-18z"/><path d="M72 430h190l-30-55H102z"/></g>
<!-- Malaysian flag flowing behind team -->
<g transform="translate(760 410) rotate(-5)" opacity=".92" filter="url(#shadow)"><path d="M0 35C180-28 420 45 690 0v300c-250 55-470-35-690 22z" fill="#fff"/>
<g fill="#d71920"><path d="M0 35c180-63 420 10 690-35v28C420 73 180 0 0 63z"/><path d="M0 91c180-63 420 10 690-35v28C420 129 180 56 0 119z"/><path d="M0 147c180-63 420 10 690-35v28c-270 45-510-28-690 35z"/><path d="M0 203c180-63 420 10 690-35v28c-270 45-510-28-690 35z"/><path d="M0 259c180-63 420 10 690-35v28c-270 45-510-28-690 35z"/></g>
<path d="M0 35c82-28 172-32 260-17v158c-86-14-174-10-260 18z" fill="#001a70"/><circle cx="112" cy="104" r="48" fill="#ffd100"/><circle cx="128" cy="104" r="38" fill="#001a70"/><path d="M174 67l9 22 23 1-18 15 6 23-20-12-20 12 6-23-18-15 23-1z" fill="#ffd100"/></g>
<!-- trophy -->
<g transform="translate(845 150)" filter="url(#shadow)"><ellipse cx="180" cy="360" rx="155" ry="42" fill="#ffc53a" opacity=".18"/><path d="M98 40h164v118c0 95-67 169-82 180-15-11-82-85-82-180z" fill="url(#gold)"/>
<path d="M100 75H38c-18 0-30 13-29 31 6 91 52 145 109 167" fill="none" stroke="#d99b21" stroke-width="27" stroke-linecap="round"/><path d="M260 75h62c18 0 30 13 29 31-6 91-52 145-109 167" fill="none" stroke="#d99b21" stroke-width="27" stroke-linecap="round"/>
<path d="M180 103l19 39 43 6-31 30 7 43-38-20-38 20 7-43-31-30 43-6z" fill="#fff0a0"/><rect x="160" y="330" width="40" height="90" rx="10" fill="#d79a20"/><rect x="112" y="405" width="136" height="28" rx="10" fill="#f0bd3f"/></g>
<!-- players -->
<g fill="url(#jersey)" stroke="#2a3345" stroke-width="3" filter="url(#shadow)">
