<g fill="#dce9ff" opacity=".42"><circle cx="80" cy="780" r="5"/><circle cx="130" cy="820" r="4"/><circle cx="210" cy="770" r="6"/><circle cx="310" cy="830" r="5"/><circle cx="400" cy="790" r="4"/><circle cx="490" cy="845" r="5"/><circle cx="1370" cy="790" r="5"/><circle cx="1450" cy="835" r="5"/><circle cx="1540" cy="775" r="6"/></g>
