<g transform="translate(770 500)"><circle cx="85" cy="20" r="45"/><path d="M30 78c27-30 80-32 110 0l32 250H0z"/><path d="M65 80L25-72l31-9 58 154z"/></g>
<g transform="translate(930 505)"><circle cx="85" cy="20" r="45"/><path d="M30 78c27-30 80-32 110 0l32 250H0z"/><path d="M90 75l35-173 32 7-17 180z"/></g>
<g transform="translate(1090 525)"><circle cx="85" cy="20" r="42"/><path d="M35 75c24-28 74-30 102 0l32 230H4z"/><path d="M75 77l-5-150 31-2 24 158z"/></g>
</g>
<g fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="28" letter-spacing="2"><text x="654" y="700" transform="rotate(-5 654 700)">MALAYSIA</text><text x="808" y="695" transform="rotate(-2 808 695)">MALAYSIA</text><text x="965" y="700">MALAYSIA</text><text x="1122" y="710" transform="rotate(4 1122 710)">MALAYSIA</text></g>
