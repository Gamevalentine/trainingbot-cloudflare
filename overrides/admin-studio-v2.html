<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>TrainingBot Studio V2</title><style>html,body{margin:0;min-height:100%;background:#060914;color:#f6f8ff;font-family:Inter,system-ui,sans-serif}.load{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.load b{display:block;font-size:20px;margin-bottom:8px}.load small{color:#8190aa}</style></head><body><div class="load"><div><b>Đang mở TrainingBot Studio V2…</b><small>TrainingBot Admin V2</small></div></div><script>(async()=>{try{const p=['/admin-v2-runtime/studio.part00','/admin-v2-runtime/studio.part01','/admin-v2-runtime/studio.part02','/admin-v2-runtime/studio.part03','/admin-v2-runtime/studio.part04','/admin-v2-runtime/studio.part05','/admin-v2-runtime/studio.part06','/admin-v2-runtime/studio.part07','/admin-v2-runtime/studio.part08','/admin-v2-runtime/studio.part09','/admin-v2-runtime/studio.part10','/admin-v2-runtime/studio.part11','/admin-v2-runtime/studio.part12'];const a=await Promise.all(p.map(async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(u+' '+r.status);return r.text()}));const s=a.join('');const bin=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const t=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(t);document.close()}catch(e){document.body.innerHTML='<div class="load"><div><b>Không thể mở Studio V2</b><small>'+String(e)+'</small></div></div>'}})();</script></body></html>
